name: Fork release

# Builds the fork as Terax.app (dev.terax.fork, ad-hoc signed) and packages the
# DMG on a GitHub macOS runner and publishes it as a GitHub prerelease
# (fork-v<version>). Run it from the Actions tab, or push a `fork-v*` tag.
# No workflow artifacts are kept.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (arm64 builds an Apple Silicon DMG)
        type: string
        default: macos-14
      run_checks:
        description: Run lint, types and tests before building
        type: boolean
        default: true
  push:
    tags:
      - "fork-v*"

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Frontend checks
        if: github.event_name == 'push' || inputs.run_checks
        run: |
          pnpm lint
          pnpm check-types
          pnpm test

      # Advisory: the runner's stable toolchain is newer than the one the code
      # is linted against locally, so new lints must not block a release.
      - name: Clippy (advisory)
        if: github.event_name == 'push' || inputs.run_checks
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        if: github.event_name == 'push' || inputs.run_checks
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build app
        run: pnpm fork:build

      - name: Sign and package
        id: package
        run: |
          set -euo pipefail
          bundle="src-tauri/target/release/bundle/macos/Terax.app"
          codesign --force --sign - "$bundle/Contents/MacOS/terax-cli"
          codesign --force --sign - --entitlements src-tauri/entitlements.plist "$bundle"
          codesign --verify --deep --strict "$bundle"
          version="$(node -p "require('./package.json').version")"
          dmg="Terax-$version-$(uname -m).dmg"
          stage="$(mktemp -d)"
          ditto "$bundle" "$stage/Terax.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname "Terax" -srcfolder "$stage" -fs HFS+ -format UDZO "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/fork-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="fork-v$VERSION"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$DMG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --prerelease
          fi
